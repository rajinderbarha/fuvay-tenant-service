name: Deploy to Bluehost VPS

on:
  workflow_run:
    workflows:
      - "Build & Push Docker Images"
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload Docker configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.ip.yml"
          target: "/srv/serviceos"
          overwrite: true

      - name: Pull and restart application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            docker compose \
              --env-file /srv/serviceos/.env.production \
              -f /srv/serviceos/docker-compose.prod.yml \
              -f /srv/serviceos/docker-compose.ip.yml \
              pull api worker super-admin tenant-portal public-site

            docker compose \
              --env-file /srv/serviceos/.env.production \
              -f /srv/serviceos/docker-compose.prod.yml \
              -f /srv/serviceos/docker-compose.ip.yml \
              run --rm api alembic upgrade head

            docker compose \
              --env-file /srv/serviceos/.env.production \
              -f /srv/serviceos/docker-compose.prod.yml \
              -f /srv/serviceos/docker-compose.ip.yml \
              up -d \
              postgres redis \
              api worker \
              super-admin tenant-portal public-site \
              postgres-backup

            sleep 15

            curl -fsS http://127.0.0.1:8000/health

            docker image prune -f
