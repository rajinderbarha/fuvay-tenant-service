name: Build & Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build production images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fuvay-serviceos-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Super Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/super-admin.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.fuvay.in
          tags: |
            ghcr.io/${{ github.repository_owner }}/fuvay-super-admin:main
          cache-from: type=gha,scope=super-admin
          cache-to: type=gha,mode=max,scope=super-admin

      - name: Build Tenant Portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/tenant-portal.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.fuvay.in
          tags: |
            ghcr.io/${{ github.repository_owner }}/fuvay-tenant-portal:main
          cache-from: type=gha,scope=tenant-portal
          cache-to: type=gha,mode=max,scope=tenant-portal

      - name: Build Public Site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/public-site.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fuvay-public-site:main
          cache-from: type=gha,scope=public-site
          cache-to: type=gha,mode=max,scope=public-site
