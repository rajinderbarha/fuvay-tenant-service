# ServiceOS — E2E: Playwright browser tests
# Runs on PRs to main only (slow — spins up both Next.js apps).
name: E2E Tests (Playwright)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/super-admin/package-lock.json
            frontend/tenant-portal/package-lock.json
            e2e/package-lock.json

      - name: Install Super Admin deps
        run: npm ci
        working-directory: frontend/super-admin

      - name: Install Tenant Portal deps
        run: npm ci
        working-directory: frontend/tenant-portal

      - name: Install E2E deps
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: e2e

      - name: Run Playwright E2E
        run: npx playwright test
        working-directory: e2e
        env:
          SUPER_ADMIN_URL: http://localhost:3000
          TENANT_PORTAL_URL: http://localhost:3001
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
