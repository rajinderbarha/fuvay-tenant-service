# ServiceOS — Nginx Reverse Proxy
# Production config: TLS termination + upstream to FastAPI workers.
# Place TLS certs in ./nginx/ssl/fullchain.pem and ./nginx/ssl/privkey.pem
# Replace YOUR_DOMAIN with actual domain before deploying.

upstream serviceos_api {
    least_conn;
    server api:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # TLS
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (complement backend middleware)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # File upload size limit (match backend)
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1000;

    # API — proxy to FastAPI
    location / {
        proxy_pass         http://serviceos_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts for long-running AI endpoints
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Rate limiting (complement backend)
        limit_req zone=api burst=20 nodelay;
    }

    # Health check — no rate limit, no auth
    location /health {
        proxy_pass http://serviceos_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Swagger — restrict in production if needed (uncomment allow/deny)
    location /docs {
        proxy_pass http://serviceos_api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # allow 10.0.0.0/8;   # internal only
        # deny all;
    }

    location /redoc {
        proxy_pass http://serviceos_api/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Metrics — restrict to internal network only
    location /metrics {
        proxy_pass http://serviceos_api/metrics;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
