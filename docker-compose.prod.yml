services:

  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - serviceos_net

  redis:
    image: redis:8-alpine
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - serviceos_net

  api:
    image: ghcr.io/rajinderbarha/fuvay-serviceos-api:${IMAGE_TAG:-main}
    restart: always
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --log-level
      - info
    env_file:
      - .env.production
    environment:
      APP_ENV: ${APP_ENV:-staging}
      BACKGROUND_JOBS_ENABLED: "false"
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_POOL_TIMEOUT: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"\]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks:
      - serviceos_net

  worker:
    image: ghcr.io/rajinderbarha/fuvay-serviceos-api:${IMAGE_TAG:-main}
    restart: always
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8001"
      - --workers
      - "1"
      - --log-level
      - info
    env_file:
      - .env.production
    environment:
      APP_ENV: ${APP_ENV:-staging}
      BACKGROUND_JOBS_ENABLED: "true"
      ENABLE_METRICS: "false"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - serviceos_net

  super-admin:
    image: ghcr.io/rajinderbarha/fuvay-super-admin:${IMAGE_TAG:-main}
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - serviceos_net

  tenant-portal:
    image: ghcr.io/rajinderbarha/fuvay-tenant-portal:${IMAGE_TAG:-main}
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    networks:
      - serviceos_net

  public-site:
    image: ghcr.io/rajinderbarha/fuvay-public-site:${IMAGE_TAG:-main}
    restart: always
    networks:
      - serviceos_net

  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/ssl:/etc/nginx/ssl:ro,Z
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      super-admin:
        condition: service_started
      tenant-portal:
        condition: service_started
      public-site:
        condition: service_started
    networks:
      - serviceos_net

  postgres-backup:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Fc -f "/backups/fuvay-$${stamp}.dump"
          find /backups -type f -name 'fuvay-*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep 86400
        done
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serviceos_net

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: always
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - serviceos_net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: always
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - serviceos_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: always
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - serviceos_net

  redis-exporter:
    image: oliver006/redis_exporter:v1.72.1
    restart: always
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - serviceos_net

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: always
    profiles: ["monitoring"]
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    networks:
      - serviceos_net

  grafana:
    image: grafana/grafana:12.0.0
    restart: always
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - serviceos_net

volumes:
  postgres_data:
  redis_data:
  postgres_backups:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  serviceos_net:
    driver: bridge
