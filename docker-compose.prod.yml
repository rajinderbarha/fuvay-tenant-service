# ServiceOS — Docker Compose (Production)
# Uses pre-built image from GHCR. Secrets via Docker secrets / env.
# Deploy: docker compose -f docker-compose.prod.yml up -d

version: "3.9"

services:
  # ── FastAPI API (multiple replicas behind nginx) ─────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/serviceos-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      APP_ENV:       production
      WORKERS:       4
      LOG_LEVEL:     info
      ENABLE_METRICS: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout:  10s
      retries:  3
    networks: [serviceos_net]
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay:       10s
        order:       rolling_update
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # ── Nginx reverse proxy + TLS termination ───────────────────────────────
  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on: [api]
    networks: [serviceos_net]

  # ── PostgreSQL (managed DB recommended in production) ───────────────────
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks: [serviceos_net]

  # ── Redis (managed Redis recommended in production) ─────────────────────
  redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks: [serviceos_net]

  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks: [serviceos_net]

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.0.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks: [serviceos_net]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  serviceos_net:
    driver: bridge
