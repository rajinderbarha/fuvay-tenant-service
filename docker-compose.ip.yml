services:

  api:
    environment:
      # Temporary IP-based deployment shortcuts; disable after OTP setup or
      # when moving traffic to the normal domain deployment.
      SIGNUP_DEV_OTP_ENABLED: ${SIGNUP_DEV_OTP_ENABLED:-true}
      MESSAGING_DEV_OTP_ENABLED: ${MESSAGING_DEV_OTP_ENABLED:-true}
      MESSAGING_DEV_PHONE_BYPASS_ENABLED: ${MESSAGING_DEV_PHONE_BYPASS_ENABLED:-true}
    ports:
      - "8000:8000"

  worker:
    healthcheck:
      disable: true

  super-admin:
    ports:
      - "3000:3000"

  tenant-portal:
    ports:
      - "3001:3001"

  public-site:
    ports:
      - "3002:80"

  nginx:
    profiles:
      - domain-only
